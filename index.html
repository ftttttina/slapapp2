<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>扇会 SlapMeet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#5b5fc7; --brand-d:#4f52b2; --brand-soft:#e8ebfa;
  --bg:#f5f5f5; --surface:#ffffff; --ink:#242424; --muted:#616161; --line:#e0e0e0; --hover:#f0f0f0;
  --ok:#6bb700; --busy:#c4314b; --away:#ffaa44;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --brand:#7f85f5; --brand-d:#9299f7; --brand-soft:#2f2f4a;
    --bg:#1f1f1f; --surface:#292929; --ink:#ffffff; --muted:#adadad; --line:#3d3d3d; --hover:#333333;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --brand:#7f85f5; --brand-d:#9299f7; --brand-soft:#2f2f4a;
  --bg:#1f1f1f; --surface:#292929; --ink:#ffffff; --muted:#adadad; --line:#3d3d3d; --hover:#333333;
  color-scheme:dark;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);
  font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  font-size:14px;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:none;padding:0}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.fx{font-family:"ZCOOL KuaiLe","PingFang SC",sans-serif}

/* ---------- Shell ---------- */
.shell{display:flex;flex-direction:column;height:100%}
.main{flex:1;min-height:0;display:flex;flex-direction:column}
.nav{order:2;display:flex;background:var(--surface);border-top:1px solid var(--line)}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;font-size:11px;color:var(--muted)}
.nav button svg{width:24px;height:24px}
.nav button.on{color:var(--brand)}
@media (min-width:720px){
  .shell{flex-direction:row}
  .nav{order:0;flex-direction:column;width:68px;border-top:none;border-right:1px solid var(--line);padding-top:10px;background:var(--bg)}
  .nav button{flex:none;padding:10px 0;position:relative}
  .nav button.on::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--brand)}
  .main{max-width:720px}
}
.screen{display:none;flex:1;min-height:0;flex-direction:column}
.screen.on{display:flex}
.topbar{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar h1{flex:1;margin:0;font-size:20px;font-weight:700}
.me{width:32px;height:32px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.icon-btn{width:36px;height:36px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--ink);font-weight:700}
.icon-btn:hover{background:var(--hover)}
.icon-btn svg{width:22px;height:22px}
.txt-btn{color:var(--brand);font-weight:700;padding:8px 10px;border-radius:6px}
.scroll{flex:1;overflow:auto}

/* ---------- People list ---------- */
.sec-h{padding:14px 16px 6px;font-size:12px;font-weight:700;color:var(--muted)}
.prow{display:flex;align-items:center;gap:12px;padding:10px 12px 10px 16px;cursor:pointer;background:var(--surface);border-bottom:1px solid var(--line)}
.prow:hover{background:var(--hover)}
.ava-w{position:relative;flex:none;width:46px;height:46px}
.ava-c{width:46px;height:46px;border-radius:50%;overflow:hidden;background:#dfe3f6}
.ava-c svg{width:100%;height:100%;display:block}
.pres{position:absolute;right:-1px;bottom:-1px;width:14px;height:14px;border-radius:50%;border:2.5px solid var(--surface)}
.rp{flex:1;min-width:0}
.rp-top{display:flex;align-items:baseline;gap:8px}
.rp-top b{flex:1;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rp-top small{color:var(--muted);font-size:12px;flex:none}
.rp-sub,.rp-msg{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rp-msg{color:var(--ink);opacity:.85}
.lv{color:#d9a400;letter-spacing:-1px}
.empty{padding:40px 24px;text-align:center;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:6px;padding:9px 16px;font-weight:700;border:1px solid var(--line);background:var(--surface)}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-d)}
.btn.danger{color:var(--busy)}
.btn.block{width:100%}

/* ---------- Editor ---------- */
.ed{padding:12px 16px 24px}
.preview{position:sticky;top:0;z-index:2;height:190px;border-radius:8px;overflow:hidden;background:linear-gradient(#3b3f6b,#2a2c48);display:flex;justify-content:center;border:1px solid var(--line)}
.preview svg{height:100%;width:auto}
.fl{display:block;font-weight:700;font-size:13px;margin:16px 0 6px}
input.in{width:100%;font:inherit;font-size:15px;padding:9px 10px;border-radius:4px;border:1px solid var(--line);border-bottom:2px solid var(--muted);background:var(--surface);color:var(--ink)}
input.in:focus{outline:none;border-bottom-color:var(--brand)}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{flex:1;padding:8px 4px;font-weight:600;border-right:1px solid var(--line)}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--brand-soft);color:var(--brand);box-shadow:inset 0 -2px 0 var(--brand)}
.tlist{border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.tlist button{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
.tlist button:last-child{border-bottom:none}
.tlist button.on{background:var(--brand-soft)}
.radio{width:18px;height:18px;border-radius:50%;border:2px solid var(--muted);flex:none;margin-top:2px}
.tlist button.on .radio{border-color:var(--brand);box-shadow:inset 0 0 0 3px var(--surface),inset 0 0 0 9px var(--brand)}
.tlist b{font-size:14px}
.tlist small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.sw button{width:34px;height:34px;border-radius:50%;border:1px solid rgba(0,0,0,.25)}
.sw button.on{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--brand)}
.ed-actions{display:flex;gap:10px;margin-top:24px}

/* ---------- Settings ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;margin:12px 12px 0}
.card h3{margin:0;font-size:15px}
.card p{margin:4px 0 0;color:var(--muted);font-size:13px;line-height:1.5}
.rb{display:flex;align-items:center;justify-content:space-between;gap:12px}
.tg{width:42px;height:22px;border-radius:11px;border:1px solid var(--muted);position:relative;flex:none;background:transparent}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--muted);transition:left .15s}
.tg.on{background:var(--brand);border-color:var(--brand)}
.tg.on::after{left:23px;background:#fff}
.meter{position:relative;height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;width:0;background:var(--brand);transition:width .08s}
.meter b{position:absolute;top:0;bottom:0;width:2px;background:var(--busy)}
.msg{color:var(--busy)!important}
.msg.good{color:var(--ok)!important}
.foot-note{color:var(--muted);font-size:12px;padding:14px 16px}

/* ---------- Call ---------- */
.call{position:fixed;inset:0;z-index:10;background:#141414;color:#fff;display:none;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.call.on{display:flex}
.call-top{display:flex;align-items:center;gap:10px;padding:10px 14px}
.call-top .ct{flex:1;min-width:0}
.call-top b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.call-top span{font-size:12px;color:#adadad}
.combo{font-size:22px;color:#ffd84d}
.tile{position:relative;flex:1;margin:0 8px;border-radius:8px;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;cursor:pointer;
  background:linear-gradient(#3b3f6b 0 74%,#2a2c48 74%)}
.wb{position:absolute;top:9%;left:6%;width:32%;height:17%;background:#e9ebf5;border-radius:4px;opacity:.85;
  background-image:repeating-linear-gradient(transparent 0 12px,rgba(91,95,199,.45) 12px 14px)}
.clock{position:absolute;top:10%;right:8%;width:40px;height:40px;border-radius:50%;background:#e9ebf5;opacity:.85}
.clock::before,.clock::after{content:"";position:absolute;left:50%;top:50%;width:3px;background:#2a2c48;transform-origin:50% 0;border-radius:2px}
.clock::before{height:12px;transform:rotate(200deg)}
.clock::after{height:9px;transform:rotate(110deg)}
.ohp{position:absolute;top:10px;left:10px;right:10px;height:6px;border-radius:3px;background:rgba(255,255,255,.2);overflow:hidden;z-index:2;display:flex;justify-content:flex-end}
.ohp i{display:block;height:100%;background:#ff4d5e;transition:width .3s}
#stage{position:absolute;left:0;right:0;bottom:0;height:86%;display:flex;justify-content:center;align-items:flex-end}
#stage svg{width:100%;height:100%;display:block}
.chat{position:absolute;top:24px;left:10px;right:10px;z-index:3;pointer-events:none;display:flex;justify-content:flex-start}
.msgc{display:flex;gap:8px;align-items:flex-start;max-width:85%;background:rgba(41,41,41,.94);border-radius:8px;padding:8px 10px;box-shadow:0 4px 12px rgba(0,0,0,.35);
  opacity:0;transform:translateY(-6px);transition:opacity .15s,transform .15s}
.msgc.show{opacity:1;transform:none}
.msgc .ma{width:26px;height:26px;border-radius:50%;overflow:hidden;background:#dfe3f6;flex:none}
.msgc .ma svg{width:100%;height:100%;display:block}
.msgc b{display:block;font-size:12px;color:#c7c9f8}
.msgc span{font-size:15px;font-weight:600}
.nametag{position:absolute;left:10px;bottom:10px;z-index:3;background:rgba(0,0,0,.6);border-radius:4px;padding:4px 8px;font-size:13px;display:flex;align-items:center;gap:6px;max-width:55%}
.nametag span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nametag .pres{position:static;width:10px;height:10px;border:none;flex:none}
.pip{position:absolute;right:10px;bottom:10px;z-index:3;width:104px;border-radius:6px;background:#292929;border:1px solid #3d3d3d;padding:8px;text-align:center;font-size:12px}
#pHearts{font-size:20px;color:#ff4d5e;letter-spacing:1px;line-height:1.2}
#pHearts .lost{color:#555}
#nag{display:none;margin-top:2px;color:#ffd84d;font-weight:700}
.hand{position:absolute;left:0;top:0;pointer-events:none;opacity:0;z-index:5;will-change:transform}
.hand svg{width:100%;height:100%;display:block;overflow:visible}
#flash{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:6}
.pop{position:absolute;left:0;top:0;font-size:46px;color:#fff;white-space:nowrap;-webkit-text-stroke:2.5px #17181c;paint-order:stroke fill;
  text-shadow:4px 4px 0 #17181c;pointer-events:none;z-index:7}
.pop.big{font-size:58px;color:#ffd84d}
.pop.bad{color:#ff4d5e}
#hint{min-height:20px;text-align:center;font-size:12.5px;color:#c8c8c8;padding:8px 16px 0;transition:opacity .6s;line-height:1.45}
.ring{position:absolute;inset:0;z-index:8;background:rgba(20,20,20,.85);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.ring.on{display:flex}
.ring-ava{width:120px;height:120px;border-radius:50%;overflow:hidden;background:#dfe3f6;animation:pulse 1s ease-out infinite}
.ring-ava svg{width:100%;height:100%;display:block}
.ring p{margin:0;font-size:16px}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(127,133,245,.7)}100%{box-shadow:0 0 0 26px rgba(127,133,245,0)}}
#count{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:100px;color:#ffd84d;-webkit-text-stroke:3px #17181c;
  paint-order:stroke fill;text-shadow:5px 5px 0 #17181c;pointer-events:none;z-index:9}
.ctrl{display:flex;justify-content:center;gap:18px;padding:12px 10px 14px}
.cbtn{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:#d6d6d6;min-width:56px}
.cbtn i{width:52px;height:52px;border-radius:50%;background:#3d3d3d;display:flex;align-items:center;justify-content:center}
.cbtn.on i{background:#5b5fc7}
.cbtn svg{width:24px;height:24px}
.cbtn.leave i{background:#c4314b;width:64px;border-radius:26px}

/* ---------- Dialog / toast ---------- */
.overlay{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:20px}
.overlay.on{display:flex}
.dialog{background:var(--surface);color:var(--ink);border-radius:8px;padding:22px 20px 18px;width:100%;max-width:380px;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.dialog small{color:var(--muted)}
.dialog h2{margin:4px 0 6px;font-size:22px}
.dialog p{margin:0 0 16px;color:var(--muted)}
.stats{display:flex;gap:8px;margin-bottom:18px}
.stats div{flex:1;border:1px solid var(--line);border-radius:6px;padding:10px 4px;text-align:center}
.stats b{display:block;font-size:22px}
.stats span{font-size:12px;color:var(--muted)}
.dlg-act{display:flex;gap:8px;justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:#292929;color:#fff;border-radius:6px;
  padding:10px 14px;font-size:13px;max-width:90%;box-shadow:0 6px 20px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}

/* ---------- Character ---------- */
.ol{stroke:#17181c;stroke-width:3;stroke-linejoin:round}
.ln{stroke:#17181c;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;fill:none}
.whole{animation:breathe 2.6s ease-in-out infinite}
.head{transform-box:fill-box;transform-origin:50% 95%}
.face{transform-box:fill-box;transform-origin:center}
.browL,.browR{transform-box:fill-box;transform-origin:center;transition:transform .12s}
.pupils{transition:transform .12s}
svg[data-s="tell"] .pupils{animation:dart .36s steps(1) infinite}
.talkm{transform-box:fill-box;transform-origin:center;animation:talk .2s ease-in-out infinite alternate}
.snapH{transform-box:fill-box;transform-origin:50% 100%}
.pop.small{font-size:30px;color:#ffd84d}
.hs{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.hs button{border:1px solid var(--line);border-radius:8px;padding:6px 4px;background:var(--surface);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
.hs button.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.hs .mh{width:52px;height:52px;border-radius:50%;overflow:hidden;background:#dfe3f6}
.hs .mh svg{width:100%;height:100%;display:block}
.grp{margin:22px 0 -4px;padding-top:12px;border-top:1px solid var(--line);font-size:16px;font-weight:700}
.preview+.grp{border-top:none;margin-top:14px;padding-top:0}
.msgc.trig{box-shadow:0 0 0 2px #ff4d5e,0 4px 12px rgba(0,0,0,.35)}
.msgc .tg8{display:none}
.msgc.trig .tg8{display:inline}
.pop.heal{font-size:34px;color:#6bdc6b}
.lobby{position:fixed;inset:0;z-index:12;background:var(--bg);display:none;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.lobby.on{display:flex}
.lb{padding:12px 16px 20px;max-width:560px;margin:0 auto}
.lb-foot{padding:10px 16px 14px;max-width:560px;width:100%;margin:0 auto;border-top:1px solid var(--line)}
.rulecard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px}
.rc-head b{font-size:17px}
.rc-head small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.rc-cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.rc-cmp figure{margin:0;border-radius:8px;overflow:hidden;border:2px solid var(--ok);background:var(--surface)}
.rc-cmp figure.no{border-color:var(--busy)}
.rc-img{height:150px;background:linear-gradient(#3b3f6b 0 74%,#2a2c48 74%)}
.rc-img svg{width:100%;height:100%;display:block}
.rc-cmp figcaption{padding:8px;font-size:12.5px;line-height:1.4}
.rc-cmp figcaption b{display:block;font-size:13px;margin-bottom:2px}
.rc-tip{background:var(--brand-soft);border-radius:6px;padding:10px 12px;font-size:13.5px;line-height:1.55;margin:0}
.rc-gen{margin:12px 0 0;padding-left:18px;color:var(--muted);font-size:13px;line-height:1.6}
.chk{display:flex;gap:8px;align-items:center;margin:14px 2px 0;font-size:14px}
.chk input{width:18px;height:18px;accent-color:var(--brand)}
.rdlg{max-height:86vh;overflow:auto;max-width:440px}
.preview{justify-content:flex-start;align-items:center;gap:12px;padding:12px}
.preview .pv-head{width:42%;max-width:160px;aspect-ratio:1;border-radius:50%;overflow:hidden;background:#dfe3f6;flex:none;border:3px solid rgba(255,255,255,.85)}
.preview .pv-head svg{width:100%;height:100%;display:block}
.pv-q{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;max-height:100%;overflow:hidden}
.pv-name{color:#c7c9f8;font-size:12px;font-weight:700}
.pv-b{background:#fff;color:#242424;border-radius:12px 12px 12px 3px;padding:6px 10px;font-size:13px;align-self:flex-start;max-width:100%;overflow-wrap:anywhere}
.pv-b.def{opacity:.55}
#stage svg{transition:transform .2s ease}
.files{position:absolute;right:12px;top:42%;z-index:5;background:#fff;color:#242424;border-radius:8px;padding:10px 12px;font-weight:700;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.4);display:none}
.files.on{display:block}
.vo,.rfi{position:absolute;z-index:5;background:#fffbe6;color:#242424;border:2px solid #17181c;border-radius:4px;padding:6px 9px;font-size:13px;font-weight:700;box-shadow:3px 3px 0 #17181c;text-align:left;line-height:1.25}
.vo small,.rfi small{display:block;font-weight:400;font-size:11.5px}
.rfi{background:#e8f0ff}
.days{position:absolute;top:24px;right:10px;z-index:3;background:rgba(0,0,0,.65);border-radius:4px;padding:4px 10px;font-size:13px;font-weight:700;display:none}
.sheet-ov{align-items:flex-end;padding:0}
.sheet{width:100%;max-width:560px;background:var(--surface);color:var(--ink);border-radius:12px 12px 0 0;padding:6px 0 calc(8px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 30px rgba(0,0,0,.3)}
.sheet::before{content:"";display:block;width:36px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 6px}
.sh-title{padding:6px 20px 10px;font-weight:700;color:var(--muted);font-size:13px;border-bottom:1px solid var(--line)}
.sheet button{display:flex;align-items:center;gap:14px;width:100%;padding:14px 20px;font-size:15px;text-align:left}
.sheet button:hover{background:var(--hover)}
.sheet button svg{width:22px;height:22px;flex:none}
.sheet .sh-cancel{justify-content:center;color:var(--muted);border-top:1px solid var(--line)}
.handle{width:40px;height:40px;display:flex;align-items:center;justify-content:center;touch-action:none;cursor:grab;color:var(--muted);flex:none;border-radius:6px}
.handle svg{width:22px;height:22px}
.reordering .prow{cursor:default}
.prow.dragging{position:relative;z-index:5;box-shadow:0 10px 26px rgba(0,0,0,.28);background:var(--surface);cursor:grabbing}
.sheet button:disabled{opacity:.35;pointer-events:none}
#reBtn.on{width:auto;padding:0 10px;color:var(--brand)}
.pinic{width:14px;height:14px;color:var(--muted);flex:none;align-self:center}
.splash{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;transition:opacity .35s}
.splash.out,.welcome.out{opacity:0;pointer-events:none}
.app-ic{width:88px;height:88px;border-radius:20px;background:linear-gradient(140deg,#8b90f7,#5b5fc7 60%,#4b4fb0);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 28px rgba(91,95,199,.35)}
.app-ic svg{width:58%;height:58%;display:block}
.app-ic.sm{width:26px;height:26px;border-radius:7px;box-shadow:none}
.ldr{width:28px;height:28px;border-radius:50%;border:3px solid var(--brand-soft);border-top-color:var(--brand);animation:spin .8s linear infinite}
.welcome{position:fixed;inset:0;z-index:35;display:flex;flex-direction:column;align-items:center;overflow:auto;transition:opacity .3s;
  background:radial-gradient(120% 60% at 50% 0%,var(--brand-soft),var(--bg) 70%);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wl-box{width:100%;max-width:440px;margin:6vh auto 0;background:var(--surface);padding:30px 28px 22px;box-shadow:0 2px 6px rgba(0,0,0,.08),0 12px 40px rgba(0,0,0,.08);border-radius:4px}
@media (max-width:480px){.wl-box{margin-top:0;box-shadow:none;border-radius:0;flex:1;max-width:none}}
.wl-brand{display:flex;align-items:center;gap:8px;margin-bottom:22px}
.wl-brand b{flex:1;font-size:15px;font-weight:600;color:var(--muted)}
.wl-box h1{margin:0 0 4px;font-size:24px;font-weight:600}
.wl-sub{margin:0 0 18px;color:var(--muted);font-size:14px}
.acct{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:12px 8px;border-top:1px solid var(--line);border-radius:0}
.acct:hover{background:var(--hover)}
.acct.other{border-bottom:1px solid var(--line)}
.ac-av{position:relative;width:44px;height:44px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.ac-av i{position:absolute;right:-2px;bottom:-2px;width:13px;height:13px;border-radius:50%;border:2px solid var(--surface)}
.ac-av.plus{background:transparent;color:var(--ink);border:1px solid var(--line);font-size:22px;font-weight:400}
.ac-tx{flex:1;min-width:0}
.ac-tx b{display:block;font-size:15px;font-weight:600}
.ac-tx small{display:block;color:var(--muted);font-size:13px}
.ac-tag{font-size:12px;color:var(--muted);flex:none}
.acct .ldr{width:20px;height:20px;border-width:2px}
.wl-foot{display:flex;gap:18px;justify-content:flex-end;width:100%;max-width:440px;padding:12px 4px;font-size:12px;color:var(--muted)}
.wl-heads{margin-top:auto;display:flex;justify-content:center;padding-top:10px;pointer-events:none}
.wl-heads .hd{width:66px;height:66px;border-radius:50%;overflow:hidden;background:#dfe3f6;border:3px solid var(--bg);margin:0 -7px -20px;animation:peek 2.6s ease-in-out infinite}
.wl-heads .hd svg{width:100%;height:100%;display:block}
@keyframes peek{0%,100%{transform:translateY(6px)}50%{transform:translateY(-4px)}}
@media (prefers-reduced-motion: reduce){.wl-heads .hd,.ldr{animation:none}}
.me{position:relative}
.me::after{content:"";position:absolute;right:-2px;bottom:-2px;width:11px;height:11px;border-radius:50%;background:var(--mood,#6bb700);border:2px solid var(--surface)}
.gantt{position:absolute;top:22px;left:50%;transform:translateX(-50%);width:min(72%,320px);height:30px;z-index:3;border-radius:4px;display:none;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.35);
  background:#fff repeating-linear-gradient(90deg,transparent 0 calc(12.5% - 1px),#e6e6e6 calc(12.5% - 1px) 12.5%)}
.gantt.on{display:block}
.g-blk{position:absolute;top:5px;bottom:5px;background:#ffb020;border-radius:3px;color:#3a2a00;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden}
.g-real{position:absolute;top:3px;bottom:3px;border:2px dashed #2fb36b;border-radius:3px;color:#1f7a45;font-size:10px;font-weight:700;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.g-ph{position:absolute;top:0;bottom:0;width:2px;background:#c4314b;left:0}
.tile.has-gantt .chat{top:60px}
.gchat{position:fixed;inset:0;z-index:11;background:var(--bg);display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.gchat.on{display:flex}
.gstack{position:relative;width:46px;height:46px;flex:none}
.gstack .sa{position:absolute;width:32px;height:32px;border-radius:50%;overflow:hidden;background:#dfe3f6;border:2px solid var(--surface)}
.gstack .sa:nth-child(1){left:0;top:0}.gstack .sa:nth-child(2){right:0;bottom:0}
.gstack svg,.stack svg{width:100%;height:100%;display:block}
.stack{display:flex;flex:none}
.stack .sa{width:30px;height:30px;border-radius:50%;overflow:hidden;background:#dfe3f6;border:2px solid var(--surface);margin-left:-10px}
.stack .sa:first-child{margin-left:0}
.gc-tt{flex:1;min-width:0}
.gc-tt b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gc-tt small{color:var(--muted);font-size:12px}
.btn.sm{padding:6px 10px;font-size:13px;flex:none}
.gc-thread{flex:1;overflow:auto;padding:12px 12px 8px;display:flex;flex-direction:column;gap:10px}
.gsys{align-self:center;font-size:12px;color:var(--muted);padding:4px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.gm{display:flex;gap:8px;align-items:flex-start;max-width:88%;align-self:flex-start}
.gm .ga{width:30px;height:30px;border-radius:50%;overflow:hidden;background:#dfe3f6;flex:none}
.gm .ga svg{width:100%;height:100%;display:block}
.gm .gb{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:4px 12px 12px 12px;padding:7px 11px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.gm .gb small{display:block;color:var(--muted);font-size:11.5px;margin-bottom:2px}
.gm .gb span{font-size:14.5px}
.gm.mine{align-self:flex-end;flex-direction:row-reverse;max-width:80%}
.gm.mine .gb{background:var(--brand);color:#fff;border-color:var(--brand);border-radius:12px 4px 12px 12px;cursor:default}
.gm.trig .gb{box-shadow:0 0 0 2px #ff4d5e}
.gm.at .gb{background:var(--brand-soft);border-color:var(--brand)}
.gm .reply{display:block;margin-top:5px;font-size:12px;font-weight:700;color:var(--brand)}
.gm.slapped .gb{opacity:.5}.gm.slapped .gb span{text-decoration:line-through}
.gm.slapped .ga{filter:grayscale(1)}
.gm.done .gb{opacity:.6}
.gm.bad .gb{box-shadow:0 0 0 2px #c4314b;background:#fde7ea;color:#242424}
.gm .hpm{position:absolute;right:-10px;top:-12px;width:30px;height:36px;opacity:.75;transform:rotate(18deg);pointer-events:none}
.gm .mark{display:block;margin-top:4px;font-size:12px;font-weight:700}
.gc-foot{background:var(--surface);border-top:1px solid var(--line);padding:10px 12px 12px}
.gc-hint{font-size:12.5px;color:var(--muted);margin:0 0 10px;line-height:1.5}
.gc-stat{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:15px}
.gc-stat .hh{color:#ff4d5e;font-size:20px;letter-spacing:1px}
.gc-stat .hh .lost{color:var(--line)}
.modes{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.mode{border:1px solid var(--line);border-radius:8px;padding:12px;text-align:left}
.mode:hover{background:var(--hover);border-color:var(--brand)}
.mode b{display:block;font-size:15px}
.mode small{color:var(--muted);font-size:12.5px}
.gm-note{font-size:12.5px!important;line-height:1.5}
.ck{width:20px;height:20px;border-radius:4px;border:2px solid var(--muted);flex:none;margin-top:12px}
.tlist button.on .ck{background:var(--brand);border-color:var(--brand);box-shadow:inset 0 0 0 3px var(--surface)}
.tlist button:disabled{opacity:.4}
.tlist .mav{width:40px;height:40px;border-radius:50%;overflow:hidden;background:#dfe3f6;flex:none}
.tlist .mav svg{width:100%;height:100%;display:block}
.muted{color:var(--muted);font-weight:400}
#meet{z-index:13}
.mgrid{position:relative;flex:1;margin:0 8px;display:grid;gap:6px;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;min-height:0;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.mgrid.n2{grid-template-columns:1fr}
.mgrid.n3 .mtile.t2{grid-column:1 / span 2}
.mtile{position:relative;border-radius:8px;overflow:hidden;background:linear-gradient(#3b3f6b 0 74%,#2a2c48 74%);cursor:pointer;min-height:0}
.mstage{position:absolute;left:0;right:0;bottom:0;top:12%}
.mstage svg{width:100%;height:100%;display:block}
.mtag{position:absolute;left:6px;bottom:6px;right:6px;display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.6);border-radius:4px;padding:3px 6px;font-size:12px;z-index:2}
.mtag span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mtag .pres{position:static;width:9px;height:9px;border:none;flex:none}
.mtag .mb{width:44px;height:5px;border-radius:3px;background:rgba(255,255,255,.25);overflow:hidden;flex:none;display:flex;justify-content:flex-end}
.mtag .mb i{display:block;height:100%;background:#ff4d5e;transition:width .3s}
.msay{position:absolute;top:6px;left:6px;right:6px;background:rgba(41,41,41,.94);border-radius:6px;padding:4px 8px;font-size:12.5px;font-weight:600;opacity:0;transition:opacity .15s;pointer-events:none;z-index:3}
.msay.show{opacity:1}.msay.trig{box-shadow:0 0 0 2px #ff4d5e}
.mtile.ko .mstage{filter:grayscale(1);opacity:.5}
.mtile.ko::after{content:attr(data-left);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;background:rgba(0,0,0,.35);z-index:4}
.mflash{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:6;border-radius:8px}
.mcount{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:90px;color:#ffd84d;-webkit-text-stroke:3px #17181c;paint-order:stroke fill;text-shadow:5px 5px 0 #17181c;pointer-events:none;z-index:9}
.mt-hearts{color:#ff4d5e;font-size:20px;letter-spacing:1px}
.mt-hearts .lost{color:#555}
.pop.mini{font-size:32px}
.qhint{margin:-2px 0 8px;color:var(--muted);font-size:12.5px}
.qrow{display:flex;gap:8px}
.qrow .btn{flex:none}
.qchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.qchip{display:inline-flex;align-items:center;gap:6px;background:var(--brand-soft);border-radius:999px;padding:5px 5px 5px 12px;font-size:13px;max-width:100%}
.qchip button{width:22px;height:22px;border-radius:50%;flex:none;color:var(--muted);font-size:15px;line-height:1}
.qchip button:hover{background:var(--hover)}
.drop{animation:drip .9s ease-in infinite}
.drop.d2{animation-delay:.45s}
@keyframes drip{0%{transform:translateY(0);opacity:1}100%{transform:translateY(40px);opacity:0}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 1.1s linear infinite}
@keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}
@keyframes dart{0%{transform:translate(-6px,0)}50%{transform:translate(6px,-1px)}}
@keyframes talk{from{transform:scaleY(.3)}to{transform:scaleY(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.whole,.ring-ava{animation:none}}
</style>
</head>
<body>
<div id="splash" class="splash"><div class="app-ic" id="spIc"></div><div class="ldr" aria-label="Loading"></div></div>
<div id="welcome" class="welcome">
  <div class="wl-box">

  <main class="main">

      <div class="scroll"><div class="ed">

<section id="call" class="call">

/* ---------------- Sound ---------------- */
const Snd={
  on:LS.get('slapduel.sound',true),ctx:null,nb:null,out:null,
  c(){
    if(!this.ctx){
      const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;
      const a=this.ctx=new C();
      const m=a.createGain();m.gain.value=this.vol||.9;m.connect(a.destination);
      const len=Math.floor(a.sampleRate*1.1),ir=a.createBuffer(2,len,a.sampleRate);
      for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3.2);}
      const cv=a.createConvolver();cv.buffer=ir;const wet=a.createGain();wet.gain.value=.16;
      m.connect(cv);cv.connect(wet);wet.connect(a.destination);
      this.out=m;
    }
    if(this.ctx.state==='suspended')this.ctx.resume();
    return this.ctx;
  },
  noise(){
    if(this.nb)return this.nb;
    const a=this.ctx,b=a.createBuffer(1,a.sampleRate,a.sampleRate),d=b.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    return this.nb=b;
  },
  env(g,t0,at,peak,dec){g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(peak,t0+at);g.gain.exponentialRampToValueAtTime(.0001,t0+at+dec);},
  ok(){return this.on&&this.c();},
  burst(t0,type,freq,q,peak,dec){
    const a=this.ctx,n=a.createBufferSource();n.buffer=this.noise();
    const f=a.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q;
    const g=a.createGain();this.env(g,t0,.001,peak,dec);
    n.connect(f).connect(g).connect(this.out);n.start(t0,Math.random()*.5);n.stop(t0+dec+.05);
  },
  sweep(t0,f1,f2,dur,vol){
    const a=this.ctx,o=a.createOscillator();o.type='sine';o.frequency.setValueAtTime(f1,t0);o.frequency.exponentialRampToValueAtTime(f2,t0+dur);
    const g=a.createGain();this.env(g,t0,.002,vol,dur);o.connect(g).connect(this.out);o.start(t0);o.stop(t0+dur+.05);
  },
  mar(f,t0,vol,dur){
    const a=this.ctx;
    [[1,vol,dur],[3.99,vol*.22,dur*.18],[10,vol*.06,dur*.06]].forEach(([m,v,d])=>{
      const o=a.createOscillator();o.type='sine';o.frequency.setValueAtTime(f*m,t0);
      const g=a.createGain();this.env(g,t0,.004,v,d);o.connect(g).connect(this.out);o.start(t0);o.stop(t0+d+.05);
    });
  },
  seq(notes,gap,vol,dur){const a=this.ok();if(!a)return;const t0=a.currentTime+.02;notes.forEach((f,i)=>{if(f)this.mar(f,t0+i*gap,vol,dur);});},
  slap(big){
    const a=this.ok();if(!a)return;const t0=a.currentTime,k=big?1.35:1;
    this.burst(t0,'highpass',2400,.7,.9*k,.035);
    this.burst(t0+.002,'bandpass',1100,.9,.8*k,.09);
    this.burst(t0+.004,'lowpass',500,.7,.5*k,.12);
    this.sweep(t0,150,60,.13,.45*k);
    if(big){this.burst(t0+.11,'highpass',2400,.7,.25,.04);[1047,1568].forEach((f,i)=>this.mar(f,t0+.18+i*.09,.12,.5));}
  },
  thud(){
    const a=this.ok();if(!a)return;const t0=a.currentTime;
    this.burst(t0,'highpass',1800,.7,1.1,.05);this.burst(t0+.002,'bandpass',800,.9,1,.12);this.burst(t0+.004,'lowpass',350,.7,.8,.16);
    this.sweep(t0,120,40,.2,.7);
    const r=a.createOscillator();r.type='sine';r.frequency.value=3400;
    const rg=a.createGain();rg.gain.setValueAtTime(.0001,t0+.1);rg.gain.exponentialRampToValueAtTime(.03,t0+.2);rg.gain.exponentialRampToValueAtTime(.0001,t0+1.1);
    r.connect(rg).connect(this.out);r.start(t0+.1);r.stop(t0+1.2);
  },
  whoosh(){
    const a=this.ok();if(!a)return;const t0=a.currentTime;
    const n=a.createBufferSource();n.buffer=this.noise();
    const bp=a.createBiquadFilter();bp.type='bandpass';bp.Q.value=1.2;
    bp.frequency.setValueAtTime(350,t0);bp.frequency.exponentialRampToValueAtTime(2600,t0+.24);
    const g=a.createGain();this.env(g,t0,.08,.45,.2);
    n.connect(bp).connect(g).connect(this.out);n.start(t0);n.stop(t0+.4);
  },
  snap(){const a=this.ok();if(!a)return;const t0=a.currentTime;this.burst(t0,'highpass',3200,.8,.7,.018);this.burst(t0+.003,'bandpass',1700,1.2,.35,.03);},
  heal(){this.seq([784,1047,1319,1568],.07,.13,.5);},
  blip(f){const a=this.ok();if(!a)return;this.mar(f,a.currentTime,.14,.4);},
  ring(){this.seq([659,784,988,784,0,0,659,784,988,1175],.13,.16,.7);},
  join(){this.seq([523,659,784],.1,.14,.6);},
  leave(){this.seq([784,659,523],.1,.14,.6);},
  msg(){this.seq([1175,1568],.085,.13,.35);},
  win(){this.seq([523,659,784,1047,0,1047],.11,.15,.7);},
  lose(){this.seq([659,523,440,330],.16,.16,.8);}
};

/* ---------------- Motion (swing to slap) ---------------- */
const Motion={
  on:false,want:LS.get('slapduel.motion',false),sens:LS.get('slapduel.sens','mid'),
  TH:{low:24,mid:17,high:12},MAX:32,got:false,last:0,gx:0,gy:0,gz:0,
  enable(){
    if(typeof DeviceMotionEvent==='undefined')return Promise.resolve('none');
    let perm=Promise.resolve('granted');
    if(typeof DeviceMotionEvent.requestPermission==='function'){
      try{perm=DeviceMotionEvent.requestPermission();}catch(e){return Promise.resolve('denied');}
    }
    return perm.then(r=>{
      if(r!=='granted')return 'denied';
      window.removeEventListener('devicemotion',Motion.h);
      window.addEventListener('devicemotion',Motion.h);
      Motion.on=true;Motion.got=false;
      return new Promise(res=>setTimeout(()=>{
        if(!Motion.got){Motion.disable();res('none');}else res('ok');
      },1200));
    }).catch(()=>'denied');
  },
  disable(){window.removeEventListener('devicemotion',Motion.h);Motion.on=false;},
  h(e){
    let x,y,z;const a=e.acceleration;
    if(a&&a.x!=null){x=a.x;y=a.y;z=a.z;}
    else{
      const g=e.accelerationIncludingGravity;if(!g||g.x==null)return;
      Motion.gx=Motion.gx*.9+g.x*.1;Motion.gy=Motion.gy*.9+g.y*.1;Motion.gz=Motion.gz*.9+g.z*.1;
      x=g.x-Motion.gx;y=g.y-Motion.gy;z=g.z-Motion.gz;
    }
    Motion.got=true;
    const mag=Math.hypot(x,y,z);
    onMotionLevel(mag);
    const now=performance.now();
    if(mag>Motion.TH[Motion.sens]&&now-Motion.last>450){
      Motion.last=now;
      const dir=Math.abs(x)<3?0:(x<0?1:-1);
      onSwing(dir);
    }
  }
};
function motionResult(r){
  if(r==='ok'){Motion.want=true;LS.set('slapduel.motion',true);toast(t('motionOk'));}
  else{Motion.want=false;LS.set('slapduel.motion',false);toast(t(r==='denied'?'motionDenied':'motionNone'));}
  const m=$('#motMsg');m.textContent=r==='ok'?t('motionOk'):t(r==='denied'?'motionDenied':'motionNone');m.classList.toggle('good',r==='ok');
  renderSettings();syncCallCtrl();
}
function toggleMotion(){
  if(Motion.on){Motion.disable();Motion.want=false;LS.set('slapduel.motion',false);$('#motMsg').textContent='';renderSettings();syncCallCtrl();return;}
  Motion.enable().then(motionResult);
}

  if(ty===11){if(s==='relax')show=new Set(['eyes','lids','m-guard','calc']);else if(s==='wait')show=new Set(['eyes','m-tell']);}
  if(ty===13){

    else if(s==='feint'||s==='rfi')show=new Set(['eyes','m-smirk','clip']);
  }
  if(ty===14&&(s==='relax'||s==='tell'))show.add('plan');
  if(ty===9)show=(s==='hit'||s==='ko')?new Set(['eyescry','tears','m-hurt','stars']):new Set(['eyescry','tears','m-cry']);
  if(ty===8){
    if(s==='snap')show=new Set(['eyes','m-smirk','snap']);

  }
  svg.querySelectorAll('.v').forEach(e=>{e.style.display=show.has(e.dataset.v)?'':'none'});
  svg.dataset.s=s;
  const pup=svg.querySelector('.pupils');
  const PUP={relax:ty===4?'translate(-5px,6px)':'translate(0px,7px)',idle:'translate(0px,3px)',dodge:'translate(5px,-3px)'};
  PUP.snap='translate(0px,-5px)';

  if(ty===11)PUP.relax='translate(0px,8px)';
  if(ty===6){PUP.relax='translate(0px,0px)';PUP.feint='translate(0px,7px)';}
  if(pup)pup.style.transform=PUP[s]||'translate(0px,0px)';
  let b=BROWS[s]||['',''];
  if(s==='snap'||s==='wait')b=BROWS.tell;
  if(s==='rfi')b=BROWS.gloat;
  if(ty===9)b=BROWS.hit;
  if(ty===6){if(s==='relax')b=BROWS.guard;else if(s==='feint')b=['',''];}
  const bl=svg.querySelector('.browL'),br=svg.querySelector('.browR');
  if(bl)bl.style.transform=b[0];if(br)br.style.transform=b[1];
}

$('#list').addEventListener('pointerdown',e=>{
  const h=e.target.closest('.handle');if(!h)return;
  e.preventDefault();
  const row=h.closest('.prow'),sec=row.dataset.sec;
  try{h.setPointerCapture(e.pointerId);}catch(_){}
  let startY=e.clientY;row.classList.add('dragging');
  const same=el=>el&&el.classList.contains('prow')&&el.dataset.sec===sec;
  const move=ev=>{
    let dy=ev.clientY-startY;row.style.transform=`translateY(${dy}px)`;
    const rr=row.getBoundingClientRect(),mid=rr.top+rr.height/2;
    const nx=row.nextElementSibling,pv=row.previousElementSibling;
    if(same(nx)){const r=nx.getBoundingClientRect();if(mid>r.top+r.height/2){row.parentNode.insertBefore(nx,row);startY+=r.height;}}
    if(same(pv)){const r=pv.getBoundingClientRect();if(mid<r.top+r.height/2){row.parentNode.insertBefore(row,pv);startY-=r.height;}}
    row.style.transform=`translateY(${ev.clientY-startY}px)`;
  };
  const end=()=>{
    h.removeEventListener('pointermove',move);h.removeEventListener('pointerup',end);h.removeEventListener('pointercancel',end);
    row.classList.remove('dragging');row.style.transform='';
    const ids=sel=>[...$('#list').querySelectorAll(`.prow[data-sec="${sel}"]`)].map(r=>r.dataset.id);
    commitOrder(ids('pin'),ids('all'));
  };
  h.addEventListener('pointermove',move);h.addEventListener('pointerup',end);h.addEventListener('pointercancel',end);
});

  G.locked=true;clearTimeout(G.timer);G.combo=0;G.side=dir;updateHud();
  const fp=facePoint(dir);
  applyVis(svg,'dodge',TY());Snd.whoosh();
  head.animate([
    {transform:'translateX(0px) rotate(0deg)'},
    {transform:`translateX(${-dir*70}px) rotate(${-dir*12}deg)`,offset:.25},
    {transform:`translateX(${-dir*70}px) rotate(${-dir*12}deg)`,offset:.7},
    {transform:'translateX(0px) rotate(0deg)'}
  ],{duration:720,easing:'ease-out'});
  swingHand(dir,fp.x,fp.y,320);
  say(msg||pick(t('dodge')),700);
  setTimeout(()=>counter(-dir),430);
}
function hurtPlayer(label){
  flash('#ff3b3b',.5);Snd.thud();vib(90);shake(20);
  const A=tile.getBoundingClientRect();
  pop(label,A.width/2,A.height*.45,'bad');
  G.pHp=Math.max(0,G.pHp-1);updateHud();
}
function counter(dir){
  if(!G.running)return;
  applyVis(svg,'counter',TY());
  const el=$('#oHand'),W=el.offsetWidth,H=el.offsetHeight,A=tile.getBoundingClientRect();
  const fl=dir>0?1:-1,sx=dir>0?-W:A.width,ex=dir>0?A.width:-W,y=A.height*.5-H/2;
  el.animate([
    {transform:`translate(${sx}px,${y+40}px) rotate(${dir*-30}deg) scaleX(${fl})`,opacity:1},
    {transform:`translate(${A.width/2-W/2}px,${y}px) rotate(0deg) scaleX(${fl})`,opacity:1,offset:.45},
    {transform:`translate(${ex}px,${y-20}px) rotate(${dir*30}deg) scaleX(${fl})`,opacity:1}
  ],{duration:420,easing:'cubic-bezier(.4,0,.2,1)'});
  setTimeout(()=>hurtPlayer(t('countered')),190);
  setTimeout(()=>{
    if(!G.running)return;
    if(G.pHp<=0)return finish(false);
    G.locked=false;setState('guard',rand(P.guard)*speed());
  },1000);
}
function nagTick(){
  if(!G.running||G.locked||G.state==='relax')return;
  G.nag++;Snd.msg();say(pickLine(),850,true);updateHud();
  if(G.nag>=6){
    G.nag=0;G.locked=true;clearTimeout(G.timer);G.combo=0;
    hurtPlayer(t('nagBoom'));
    setTimeout(()=>{
      if(!G.running)return;
      if(G.pHp<=0)return finish(false);
      G.locked=false;setState('guard',rand(P.guard)*speed());
    },900);
  }
}
function finish(win){
  G.running=false;G.locked=true;clearTimers();
  const ty=TY(),X=TT(ty);
  if(win){
    applyVis(svg,'ko',ty);Snd.win();say(X.ko,2200);
    head.animate([{transform:'rotate(0deg)'},{transform:'rotate(18deg) translateY(10px)'}],{duration:500,fill:'forwards',easing:'ease-out'});
    cur.stats.w++;
  }else{
    applyVis(svg,'gloat',ty);Snd.lose();say(X.gloat,2200);
    cur.stats.l++;
  }
  cur.stats.best=Math.max(cur.stats.best,G.best);
  saveProfiles();
  setTimeout(()=>{
    if(!$('#call').classList.contains('on'))return;
    $('#rKicker').textContent=`${t('callEnded')} · ${$('#cTime').textContent}`;
    $('#rTitle').textContent=t(win?'winTitle':'loseTitle');
    $('#rSub').textContent=`${nameOf(cur)}：${win?X.ko:X.gloat}`;
    $('#rHits').textContent=G.hits;$('#rPerf').textContent=G.perfects;$('#rCombo').textContent=G.best;
    $('#homeBtn').textContent=t('other');resultCtx=null;$('#result').classList.add('on');
  },1300);
}

let curGroup=null,GC=null;
function openGroup(id){
  curGroup=groups.find(g=>g.id===id);if(!curGroup)return;Snd.c();

  if(mem.length<2){toast(t('gNeed'));openGroupEditor(id);return;}

  gcIdle();$('#gchat').classList.add('on');
}
function gcMsgHTML(p,text,cls,extra){
  return `<div class="gm ${cls||''}"><div class="ga">${avatar(p)}</div><button class="gb"><small>${esc(nameOf(p))}</small><span>${esc(text)}</span>${extra||''}</button></div>`;
}
function gcIdle(){
  if(GC){clearTimeout(GC.spawnT);clearInterval(GC.clockT);GC.running=false;}
  const mem=gMembers(curGroup),th=$('#gcThread');
  const tp=t('topics')[0];
  th.innerHTML=`<div class="gm mine"><div class="gb"><span>${esc(tp.me)}</span></div></div>`+gcMsgHTML(NPCS[0],tp.r[0],'done')
    +mem.map(p=>gcMsgHTML(p,(p.quotes&&p.quotes[0])||TT(p.type).lines[0],'done')).join('')+gcMsgHTML(NPCS[1],tp.r[2],'done');
  $('#gcFoot').innerHTML=`<p class="gc-hint">${t('chatHint')}</p><button class="btn primary block" id="gcStart">${t('chatStart')}</button>`;
  $('#gcStart').onclick=gcStart;th.scrollTop=th.scrollHeight;
}
function gcFoot(){
  $('#gcFoot').innerHTML=`<div class="gc-stat"><span>⏱ ${GC.time}s</span><span class="hh">${[0,1,2].map(i=>`<span class="${i<GC.pHp?'':'lost'}">♥</span>`).join('')}</span><span>${t('chatScore')(GC.score)}</span></div>`;
}
function gcStart(){
  Snd.c();if(GC){clearTimeout(GC.spawnT);clearInterval(GC.clockT);}
  GC={time:45,pHp:3,score:0,combo:0,best:0,running:true,n:0};
  const th=$('#gcThread');th.innerHTML=`<div class="gsys">${t('chatGo')}</div>`;
  gcFoot();Snd.join();
  GC.clockT=setInterval(()=>{if(!GC.running)return;GC.time--;gcFoot();if(GC.time<=0)gcEnd(true);},1000);
  GC.spawnT=setTimeout(gcSpawn,700);
}
function gcHurt(el,label){
  GC.pHp--;GC.combo=0;Snd.thud();vib(70);el.classList.add('bad');
  const m=document.createElement('span');m.className='mark';m.style.color='#c4314b';m.textContent=label;el.querySelector('.gb').appendChild(m);
  el.animate([{transform:'translateX(0)'},{transform:'translateX(-8px)'},{transform:'translateX(8px)'},{transform:'translateX(0)'}],{duration:260});
  gcFoot();if(GC.pHp<=0)gcEnd(false);
}
function gcAppend(html){
  const th=$('#gcThread'),w=document.createElement('div');w.innerHTML=html;const el=w.firstElementChild;th.appendChild(el);
  while(th.children.length>50)th.firstElementChild.remove();th.scrollTop=th.scrollHeight;
  el.animate([{transform:'translateY(10px)',opacity:0},{transform:'none',opacity:1}],{duration:180,easing:'ease-out'});return el;
}
function gcMe(text){if(GC&&GC.running)gcAppend(`<div class="gm mine"><div class="gb"><span>${esc(text)}</span></div></div>`);}
function gcSpawn(){
  if(!GC||!GC.running)return;
  const k=Math.max(.5,1-(45-GC.time)/70),next=ms=>{GC.spawnT=setTimeout(gcSpawn,ms*k);};
  if(!GC.left||GC.left<=0){
    const tps=t('topics').filter(x=>x.me!==(GC.topic&&GC.topic.me));GC.topic=pick(tps);GC.left=5+Math.floor(Math.random()*3);
    gcMe(GC.topic.me);next(900+Math.random()*400);return;
  }
  GC.left--;
  if(Math.random()<.1){gcMe(pick(t('meMid')));next(600+Math.random()*400);return;}
  const mem=gMembers(curGroup),p=pick([...mem,...mem,...NPCS]),r=Math.random();
  let kind,text;
  if(p.npc){kind='good';text=r<.7?pick(GC.topic.r):pick(t('okMsgs'));}
  else if(r<.4){kind='trig';text=lineOf(p);}
  else if(r<.78){kind='ok';text=pick(GC.topic.r);}
  else if(r<.9){kind='ok';text=pick(t('okMsgs'));}
  else{kind='at';text='@'+t('youShort')+' '+pick(t('atMsgs'));}
  const el=gcAppend(gcMsgHTML(p,text,kind==='trig'?'trig':kind==='at'?'at':'',kind==='at'?`<span class="reply">${t('replyLbl')}</span>`:''));
  const btn=el.querySelector('.gb');let done=false;
  const expire=setTimeout(()=>{if(done||!GC.running)return;done=true;
    if(kind==='at'){el.querySelector('.reply').remove();gcHurt(el,t('missedAt'));}
    else{el.classList.add('done');if(kind==='trig')GC.combo=0;}
  },kind==='at'?3000:3500);
  btn.addEventListener('pointerdown',e=>{
    e.preventDefault();if(done||!GC.running)return;done=true;clearTimeout(expire);
    if(kind==='trig'){
      GC.combo++;GC.best=Math.max(GC.best,GC.combo);GC.score+=GC.combo>=5?2:1;
      if(GC.pHp<3&&GC.combo%5===0){GC.pHp++;Snd.heal();}
      Snd.slap(GC.combo%5===0);vib(25);el.classList.add('slapped');
      btn.insertAdjacentHTML('beforeend',`<svg class="hpm" viewBox="0 0 120 150">${handShape('#e3263b',false)}</svg>`);
      el.animate([{transform:'translateX(0) rotate(0)'},{transform:'translateX(-10px) rotate(-2deg)'},{transform:'translateX(4px)'},{transform:'none'}],{duration:280});
      gcFoot();
      if(Math.random()<.3)setTimeout(()=>gcMe(pick(t('meRetort'))),450);
    }else if(kind==='at'){
      el.querySelector('.reply').textContent=t('replied');el.classList.add('done');Snd.msg();
      setTimeout(()=>gcMe(pick(t('meReply'))),350);
    }else gcHurt(el,kind==='good'?t('slapGood'):t('wrongSlap'));
  });
  next(650+Math.random()*550);
}
function gcEnd(timeUp){
  if(!GC.running)return;GC.running=false;clearTimeout(GC.spawnT);clearInterval(GC.clockT);
  (timeUp?Snd.win:Snd.lose).call(Snd);
  curGroup.stats=curGroup.stats||{};curGroup.stats.chatBest=Math.max(curGroup.stats.chatBest||0,GC.score);
  curGroup.stats.best=Math.max(curGroup.stats.best||0,GC.score);saveGroups();
  setTimeout(()=>{
    $('#rKicker').textContent=t('resultChat');
    $('#rTitle').textContent=timeUp?t('timeUp'):t('chatLose');
    $('#rSub').textContent=`${t('chatWin')(GC.score)} · ${t('scoreLbl')} ${GC.score}`;
    $('#rHits').textContent=GC.score;$('#rPerf').textContent='—';$('#rCombo').textContent=GC.best;
    $('#result').classList.add('on');$('#homeBtn').textContent=t('backChat');
    resultCtx={again:gcStart,home:gcIdle};
  },600);
}

$('#gcMeet').onclick=()=>{if(GC&&GC.running){GC.running=false;clearTimeout(GC.spawnT);clearInterval(GC.clockT);gcIdle();}$('#gmDlg').classList.add('on');};

/* ---- group meeting (gallery) ---- */
let MG=null;const GSLOW=1.25;const mgrid=$('#mgrid');
function mSyncSnd(){syncCallCtrl();$('#mSnd i').innerHTML=$('#sndBtn i').innerHTML;$('#mSnd').classList.toggle('on',Snd.on);}
$('#mSnd').onclick=e=>{e.stopPropagation();Snd.on=!Snd.on;LS.set('slapduel.sound',Snd.on);mSyncSnd();};
function mStopAll(){if(!MG)return;MG.running=false;clearInterval(MG.clockT);clearTimeout(MG.cdT);MG.parts.forEach(pt=>{clearTimeout(pt.timer);clearTimeout(pt.sayT);});}
function startMeet(mode){
  $('#gmDlg').classList.remove('on');Snd.c();
  const mem=gMembers(curGroup);if(mem.length<2){toast(t('gNeed'));return;}
  mStopAll();
  mgrid.querySelectorAll('.mtile').forEach(e=>e.remove());mgrid.className='mgrid n'+mem.length;
  MG={mode,pHp:3,score:0,hits:0,perfects:0,combo:0,best:0,secs:0,timeLeft:60,running:false,locked:true,lastTap:0,parts:[]};
  mem.forEach((p,i)=>{
    const el=document.createElement('div');el.className='mtile'+(i===2&&mem.length===3?' t2':'');
    el.innerHTML=`<div class="mstage">${buildChar(p,'20 30 260 330')}</div><div class="msay"></div><div class="mtag"><i class="pres" style="background:${PRES[TYPES[p.type].st]}"></i><span>${esc(nameOf(p))}</span><div class="mb"><i></i></div></div>`;
    mgrid.insertBefore(el,$('#mHand'));
    const svgE=el.querySelector('svg'),ty=+p.type,T=TYPES[ty],B=BODY[p.body];
    const pt={p,ty,T,B,el,svg:svgE,head:svgE.querySelector('.head'),face:svgE.querySelector('.face'),max:ty===9?6:T.hp+B.hp,state:'idle',trig:false,ko:false,busy:false};
    pt.hp=pt.max;applyVis(svgE,'idle',ty);MG.parts.push(pt);mHud(pt);
    el.addEventListener('pointerdown',e=>{e.preventDefault();const r=el.getBoundingClientRect();mTap(pt,e.clientX-r.left<r.width/2?-1:1);});
  });
  $('#mtName').textContent=gName(curGroup);$('#mtTime').textContent='00:00';
  mHearts();mScore();mSyncSnd();
  $('#meet').classList.add('on');
  const W=mgrid.clientWidth;const hw=Math.min(W*.3,170);$('#mHand').style.width=hw+'px';$('#mHand').style.height=hw*1.25+'px';
  $('#mHand').innerHTML=`<svg viewBox="-10 -10 140 170">${handShape('#f3c7a0',true)}</svg>`;
  const ow=Math.min(W*.7,380);$('#moHand').style.width=ow+'px';$('#moHand').style.height=ow*1.25+'px';
  Snd.ring();
  const c=$('#mCount'),seq=['3','2','1',t('go')];let i=0;

    i++;MG.cdT=setTimeout(step,i===seq.length?520:650);
  };
  MG.cdT=setTimeout(step,900);
}
function mBegin(){
  MG.running=true;MG.locked=false;Snd.join();
  MG.parts.forEach((pt,i)=>{if(pt.ty===9)mSet(pt,'cry',0);else mSet(pt,'guard',rand(pt.T.guard)*GSLOW+i*.35);});
  MG.clockT=setInterval(()=>{
    if(!MG.running)return;MG.secs++;
    $('#mtTime').textContent=String(Math.floor(MG.secs/60)).padStart(2,'0')+':'+String(MG.secs%60).padStart(2,'0');
    if(MG.mode==='time'){MG.timeLeft--;mScore();if(MG.timeLeft<=0)mEnd('time');}
  },1000);
}
function mHud(pt){pt.el.querySelector('.mb i').style.width=(pt.hp/pt.max*100)+'%';}
function mHearts(){$('#mtHearts').innerHTML=[0,1,2].map(i=>`<span class="${i<MG.pHp?'':'lost'}">♥</span>`).join('');}
function mScore(){$('#mtScore').textContent=MG.mode==='time'?`${MG.score} · ⏱${MG.timeLeft}`:(MG.combo>=2?t('combo')(MG.combo):'');}
function mSay(pt,text,ms,trig){
  const b=pt.el.querySelector('.msay');b.textContent=text;b.classList.add('show');
  const tr=!!trig&&pt.ty!==9;b.classList.toggle('trig',tr);pt.trig=tr;
  clearTimeout(pt.sayT);pt.sayT=setTimeout(()=>{b.classList.remove('show');pt.trig=false;},ms);
}
function mSpeed(pt){return Math.max(.6,1-.06*(pt.max-pt.hp))*pt.B.spd*GSLOW;}
function mSet(pt,st,dur){
  pt.state=st;pt.stateStart=performance.now();pt.stateDur=dur;applyVis(pt.svg,st,pt.ty);
  clearTimeout(pt.timer);if(dur)pt.timer=setTimeout(()=>mNext(pt),dur*1000);
  const ty=pt.ty;
  if(st==='guard'&&ty!==5&&Math.random()<.3)mSay(pt,lineOf(pt.p),1100,true);
  if(st==='guard'&&ty===5&&Math.random()<.6)mSay(pt,lineOf(pt.p),1000,true);
  if(st==='relax'&&(ty===4||ty===6))mSay(pt,lineOf(pt.p),dur*1000,true);
  if(st==='relax'&&ty===5)mSay(pt,t('breath'),dur*1000);
  if(st==='relax'&&ty===8)mSay(pt,t('snapRelax'),dur*1000);
}
function mNext(pt){
  if(!MG.running||pt.ko||pt.busy)return;
  const sp=mSpeed(pt),P=pt.T;
  switch(pt.state){
    case 'relax':mSet(pt,'tell',P.tell*sp);break;
    case 'tell':case 'feint':mSet(pt,'guard',rand(P.guard)*sp);break;
    default:if(Math.random()<P.feint)mSet(pt,'feint',rand(P.relax)*sp);else mSet(pt,'relax',rand(P.relax)*sp);
  }
}
function mFace(pt,dir){const f=pt.face.getBoundingClientRect(),A=mgrid.getBoundingClientRect();return{x:f.left-A.left+f.width/2+dir*f.width*.28,y:f.top-A.top+f.height*.6};}
function mSwing(dir,fp,dur){
  const el=$('#mHand'),W=el.offsetWidth,H=el.offsetHeight,A=mgrid.getBoundingClientRect();
  const sx=dir>0?A.width+W*.2:-W*1.2,sy=A.height*.8,fl=dir>0?1:-1;
  el.animate([
    {transform:`translate(${sx}px,${sy}px) rotate(${dir*55}deg) scaleX(${fl})`,opacity:1},
    {transform:`translate(${fp.x-W/2}px,${fp.y-H/2}px) rotate(${dir*-8}deg) scaleX(${fl})`,opacity:1,offset:.55},
    {transform:`translate(${fp.x-W/2-dir*W*1.3}px,${fp.y-H/2+30}px) rotate(${dir*-45}deg) scaleX(${fl})`,opacity:0}
  ],{duration:dur,easing:'cubic-bezier(.3,0,.2,1)'});
}
function mTap(pt,dir){
  if(!MG||!MG.running||MG.locked||pt.ko||pt.busy)return;
  const now=performance.now();if(now-MG.lastTap<300)return;MG.lastTap=now;
  const st=pt.state;
  if(pt.ty===9||st==='relax'||st==='tell'){
    let perfect=false;
    if(st==='relax'){const f=(now-pt.stateStart)/(pt.stateDur*1000);perfect=pt.ty===8?f<.4:(f>.3&&f<.7);}
    mHit(pt,dir,perfect);
  }else mMiss(pt,dir);
}
function mHit(pt,dir,perfect){
  pt.busy=true;clearTimeout(pt.timer);const trig=pt.trig;
  const fp=mFace(pt,dir),slow=perfect?1.8:1,impact=260*slow*.55;
  mSwing(dir,fp,260*slow);
  setTimeout(()=>{
    if(!MG.running)return;
    applyVis(pt.svg,'hit',pt.ty);Snd.slap(perfect);vib(perfect?50:25);
    const g=pt.svg.querySelector('.prints');if(g.children.length>=6)g.firstElementChild.remove();
    g.insertAdjacentHTML('beforeend',`<g opacity=".55" transform="translate(${(150+dir*pt.B.rx*.52).toFixed(1)} 160) rotate(${dir*-15}) scale(.3) translate(-60 -75)">${handShape('#e3263b',false)}</g>`);
    pt.head.animate([{transform:'rotate(0deg)'},{transform:`rotate(${-dir*24}deg) translateX(${-dir*20}px)`,offset:.2},{transform:`rotate(${dir*5}deg)`,offset:.6},{transform:'rotate(0deg)'}],{duration:perfect?900:620,easing:'ease-out'});
    pop(perfect?t('perfect'):pick(t('slaps')),fp.x,fp.y-30,perfect?'big':'mini',mgrid);shake(perfect?12:6,pt.el);
    if(perfect)$('#mFlash').animate([{opacity:.7,background:'#fff'},{opacity:0,background:'#fff'}],{duration:400});
    pt.hp=Math.max(0,pt.hp-(perfect?2:1));MG.hits++;if(perfect)MG.perfects++;MG.combo++;MG.best=Math.max(MG.best,MG.combo);
    MG.score+=perfect?2:1;
    if(trig&&MG.pHp<3){MG.pHp++;Snd.heal();setTimeout(()=>pop(t('heal'),fp.x,fp.y-80,'heal',mgrid),150);mHearts();}
    mHud(pt);mScore();mSay(pt,pick(t('hurt')),600);
  },impact);
  setTimeout(()=>{
    if(!MG.running)return;pt.busy=false;
    if(pt.hp<=0)return mKO(pt);
    if(pt.ty===9)mSet(pt,'cry',0);else mSet(pt,'guard',rand(pt.T.guard)*mSpeed(pt));
  },impact+(perfect?950:650));
}
function mMiss(pt,dir){
  MG.locked=true;MG.combo=0;mScore();pt.busy=true;clearTimeout(pt.timer);
  const fp=mFace(pt,dir);applyVis(pt.svg,'dodge',pt.ty);Snd.whoosh();
  pt.head.animate([{transform:'translateX(0px)'},{transform:`translateX(${-dir*50}px) rotate(${-dir*12}deg)`,offset:.25},{transform:`translateX(${-dir*50}px) rotate(${-dir*12}deg)`,offset:.7},{transform:'translateX(0px)'}],{duration:700,easing:'ease-out'});
  mSwing(dir,fp,320);mSay(pt,pick(t('dodge')),700);
  setTimeout(()=>{
    if(!MG.running)return;
    applyVis(pt.svg,'counter',pt.ty);
    const el=$('#moHand');el.innerHTML=`<svg viewBox="-10 -10 140 170">${handShape(SKIN[pt.p.skin]||SKIN[0],true)}</svg>`;
    const W=el.offsetWidth,H=el.offsetHeight,A=mgrid.getBoundingClientRect(),d=-dir,fl=d>0?1:-1,y=A.height*.45-H/2;
    el.animate([{transform:`translate(${d>0?-W:A.width}px,${y+40}px) rotate(${d*-30}deg) scaleX(${fl})`,opacity:1},{transform:`translate(${A.width/2-W/2}px,${y}px) scaleX(${fl})`,opacity:1,offset:.45},{transform:`translate(${d>0?A.width:-W}px,${y-20}px) rotate(${d*30}deg) scaleX(${fl})`,opacity:1}],{duration:420,easing:'cubic-bezier(.4,0,.2,1)'});
    setTimeout(()=>{
      $('#mFlash').animate([{opacity:.5,background:'#ff3b3b'},{opacity:0,background:'#ff3b3b'}],{duration:420});
      Snd.thud();vib(90);shake(18,mgrid);pop(t('countered'),A.width/2,A.height*.45,'bad',mgrid);
      MG.pHp=Math.max(0,MG.pHp-1);mHearts();
    },190);
    setTimeout(()=>{
      if(!MG.running)return;pt.busy=false;MG.locked=false;
      if(MG.pHp<=0)return mEnd('lose');
      mSet(pt,'guard',rand(pt.T.guard)*mSpeed(pt));
    },1000);
  },430);
}
function mKO(pt){
  pt.ko=true;clearTimeout(pt.timer);applyVis(pt.svg,'ko',pt.ty);
  pt.head.animate([{transform:'rotate(0deg)'},{transform:'rotate(18deg) translateY(10px)'}],{duration:500,fill:'forwards',easing:'ease-out'});
  mSay(pt,TT(pt.ty).ko,1800);MG.score+=5;mScore();
  setTimeout(()=>{pt.el.dataset.left=t('left');pt.el.classList.add('ko');},700);
  if(MG.parts.every(x=>x.ko)){if(MG.mode==='time')MG.score+=Math.max(0,MG.timeLeft);mEnd('win');}
}
function mEnd(kind){
  if(!MG.running)return;mStopAll();MG.locked=true;
  (kind==='lose'?Snd.lose:Snd.win).call(Snd);
  const st=curGroup.stats=curGroup.stats||{};
  if(kind==='win')st.w=(st.w||0)+1;if(kind==='lose')st.l=(st.l||0)+1;
  st.best=Math.max(st.best||0,MG.score);saveGroups();
  setTimeout(()=>{
    if(!$('#meet').classList.contains('on'))return;
    $('#rKicker').textContent=`${t('resultMeet')} · ${$('#mtTime').textContent}`;
    $('#rTitle').textContent=kind==='win'?t('meetWinKO'):kind==='lose'?t('meetLoseKO'):t('timeUp');
    $('#rSub').textContent=`${t('scoreLbl')} ${MG.score}`;
    $('#rHits').textContent=MG.hits;$('#rPerf').textContent=MG.perfects;$('#rCombo').textContent=MG.best;
    $('#result').classList.add('on');$('#homeBtn').textContent=t('backChat');
    const mode=MG.mode;resultCtx={again:()=>startMeet(mode),home:mLeave};
  },1100);
}
function mLeave(){
  if($('#meet').classList.contains('on'))Snd.leave();
  mStopAll();$('#meet').classList.remove('on');$('#result').classList.remove('on');
  if(curGroup)gcIdle();
}
$('#mLeave').onclick=e=>{e.stopPropagation();mLeave();};

const MOODS=[{c:'#6bb700',vol:.7,vib:.7,mail:'fine'},{c:'#ffaa44',vol:.9,vib:1,mail:'annoyed'},{c:'#c4314b',vol:1.15,vib:1.4,mail:'boom'}];
const HAND_IC=`<svg viewBox="-6 -4 132 156">${handShape('#ffffff',false)}</svg>`;
document.querySelectorAll('.app-ic').forEach(e=>e.innerHTML=HAND_IC);
function setMood(i){
  const m=MOODS[i];document.documentElement.style.setProperty('--mood',m.c);
  Snd.vol=m.vol;if(Snd.out)Snd.out.gain.value=m.vol;VIBK=m.vib;
}
function renderWelcome(){
  const last=LS.get('slapduel.mood',null);
  $('#accts').innerHTML=MOODS.map((m,i)=>`<button class="acct" data-m="${i}"><span class="ac-av">${esc(t('youShort'))}<i style="background:${m.c}"></i></span><span class="ac-tx"><b>${t('moodName')[i]}</b><small>${m.mail}@slapmeet.app</small></span><span class="ac-tag">${last===i?t('lastUsed'):''}</span></button>`).join('');
  const heads=[...profiles.filter(p=>p.pinned),...profiles.filter(p=>!p.pinned)].slice(0,6);
  $('#wlHeads').innerHTML=heads.map((p,i)=>`<div class="hd" style="animation-delay:${i*.18}s">${avatar(p,+p.type===5?'guard':'idle')}</div>`).join('');
}
function signIn(i,btn){
  Snd.c();setMood(i);LS.set('slapduel.mood',i);
  if(btn){const tag=btn.querySelector('.ac-tag');tag.innerHTML='<div class="ldr"></div>';btn.querySelector('small').textContent=t('signingIn');}
  setTimeout(()=>{$('#welcome').classList.add('out');Snd.join();setTimeout(()=>$('#welcome').style.display='none',320);},btn?650:0);
}
$('#accts').addEventListener('click',e=>{const b=e.target.closest('.acct');if(b)signIn(+b.dataset.m,b);});
$('#wlOther').onclick=()=>toast(t('otherToast'));
$('#wlLang').onclick=()=>setLang(lang==='zh'?'en':'zh');
{const m=LS.get('slapduel.mood',null);if(m!=null)setMood(m);}
applyI18n();renderPeople();renderSettings();renderWelcome();
setTimeout(()=>{$('#splash').classList.add('out');setTimeout(()=>$('#splash').style.display='none',380);},1200);
</script>
